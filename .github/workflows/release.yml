name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Install exact development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify source and committed distribution files
        run: npm run ci:check
      - name: Pack verified build
        run: npm pack --ignore-scripts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fylar-dsh-fylar-office-editor-*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
